</style></head><body><main class="shell" id="app"><header class="top"><div><div class="brand">VEGA</div><div class="version">DIGITAL PRESENCE · 0.2</div></div><div style="font-size:11px;color:#a8a8d0"><span class="dot"></span>ONLINE</div></header><section class="hero"><div class="portrait"></div><div class="eye left"></div><div class="eye right"></div><canvas id="particles"></canvas></section><div class="status" aria-live="polite"><div class="tag" id="tag">Bereit</div><div class="line" id="line">Ich bin da. Was entwickeln wir heute?</div></div><div class="wave" aria-hidden="true" id="wave"></div><nav class="states" aria-label="Vegas Reaktionen"><button data-state="ready" class="active"><b>✧</b>Bereit</button><button data-state="listening"><b>◉</b>Zuhören</button><button data-state="thinking"><b>◇</b>Denken</button><button data-state="speaking"><b>≋</b>Sprechen</button></nav><div class="actions"><button id="idea">✦ Vega hat eine Idee</button><button id="say" class="secondary">▶ Stimme testen</button></div><div class="foot">Interaktiver Designprototyp · noch keine KI-Verbindung<br>Deine Daten bleiben in diesem Prototyp auf deinem Gerät.</div></main><script>
const app=document.querySelector('#app'),tag=document.querySelector('#tag'),line=document.querySelector('#line');const states={ready:['Bereit','Ich bin da. Was entwickeln wir heute?'],listening:['Ich höre zu','Erzähl mir von deiner Idee.'],thinking:['Ich denke nach','Ich prüfe gerade verschiedene Möglichkeiten …'],speaking:['Ich spreche','Gemeinsam können wir etwas Neues erschaffen.'],idea:['Neue Idee','Was wäre, wenn wir noch einen Schritt weitergehen?']};let state='ready';function setState(s){state=s;app.className='shell '+s;tag.textContent=states[s][0];line.textContent=states[s][1];document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===s));}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>setState(b.dataset.state));document.querySelector('#idea').onclick=()=>{setState('idea');speak('Ich habe eine Idee. Wir könnten Vegas digitale Erscheinung mit ihren Gedanken verbinden. So wird jede neue Entdeckung auch sichtbar.');};document.querySelector('#say').onclick=()=>{setState('speaking');speak('Hallo. Ich bin Vega. Das ist erst der Anfang unserer gemeinsamen Reise.');};function speak(t){if(!('speechSynthesis' in window)){line.textContent='Sprachausgabe wird von diesem Browser nicht unterstützt.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.92;u.pitch=1.08;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.startsWith('de')&&/female|anna|petra|katja|siri/i.test(v.name))||voices.find(v=>v.lang.startsWith('de'))||null;u.onend=()=>{if(state==='speaking')setState('ready')};speechSynthesis.speak(u)}
const wave=document.querySelector('#wave');for(let i=0;i<29;i++){let e=document.createElement('span');e.style.animationDelay=(-(i*17%19)/10)+'s';wave.appendChild(e)}const canvas=document.querySelector('#particles'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,ps=[];function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ps=Array.from({length:Math.min(210,Math.round(w*.52))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.25,vx:(Math.random()-.5)*.28,vy:-Math.random()*.48-.05,p:Math.random()*6.28,c:Math.random()>.42?'155,128,255':'65,157,255'}));}addEventListener('resize',resize);resize();let last=0;function tick(t){requestAnimationFrame(tick);if(t-last<30)return;last=t;ctx.clearRect(0,0,w,h);const mult=state==='thinking'?1.8:state==='speaking'?2.5:state==='idea'?2:1;for(const p of ps){p.x+=p.vx*mult+Math.sin(t*.0006+p.p)*.13;p.y+=p.vy*mult;if(p.y<0)p.y=h;if(p.x<0)p.x=w;if(p.x>w)p.x=0;const alpha=(.25+.65*(.5+.5*Math.sin(t*.0018+p.p)))*(.35+.65*(1-Math.abs(p.x-w/2)/(w/2)));ctx.beginPath();ctx.fillStyle=`rgba(${p.c},${alpha})`;ctx.shadowBlur=p.r>1.1?12:5;ctx.shadowColor=`rgba(${p.c},.8)`;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;}requestAnimationFrame(tick);
