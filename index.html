<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#070914"><title>VEGA LOCAL 0.1 · Digital Presence</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050712;color:#e9eaff}body{display:flex;justify-content:center;align-items:center;padding:16px}.shell{width:min(100%,460px);min-height:min(850px,calc(100dvh - 32px));position:relative;overflow:hidden;border:1px solid #32315a;border-radius:28px;background:radial-gradient(ellipse at 50% 35%,#171b39 0,#090d20 47%,#050712 85%);box-shadow:0 22px 80px #0009}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 8px;position:relative;z-index:2}.brand{font-size:13px;font-weight:700;letter-spacing:.32em;color:#d7d6ff}.version{font-size:10px;letter-spacing:.12em;color:#8d94bd}.stage{height:clamp(330px,52dvh,490px);position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block}.halo{position:absolute;inset:13% 6%;pointer-events:none;background:radial-gradient(ellipse,#4553c020 0%,#0000 62%)}.state{text-align:center;position:relative;z-index:2;margin-top:-12px;min-height:76px}.state h1{font-size:19px;letter-spacing:.08em;font-weight:500;margin:0 0 9px}.state p{margin:0 24px;font-size:12px;line-height:1.6;color:#a5accd}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 20px 10px}.controls button{border:1px solid #39375d;border-radius:13px;background:#17192f;color:#c9cbea;padding:13px 3px;font-size:11px;cursor:pointer;transition:background .2s,border .2s,transform .2s}.controls button.active{border-color:#8880ff;background:#383064;color:#fff;box-shadow:0 0 20px #7771ff28}.controls button:active{transform:scale(.96)}.bottom{padding:10px 20px 23px}.speak{width:100%;border:1px solid #7775bc;border-radius:14px;padding:15px;background:linear-gradient(100deg,#383270,#263f75);color:#fff;font-size:14px;cursor:pointer}.small{font-size:11px;color:#858bad;text-align:center;line-height:1.6;margin:12px 4px 0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#81dfff;margin-right:6px;box-shadow:0 0 9px #81dfff}.glowline{height:1px;margin:12px 25px 0;background:linear-gradient(90deg,transparent,#625caa66,transparent)}@media(max-height:720px){.stage{height:40dvh;min-height:260px}.top{padding-top:17px}.bottom{padding-bottom:14px}}@media(prefers-reduced-motion:reduce){.controls button{transition:none}}
</style></head><body><main class="shell"><header class="top"><div class="brand">V E G A</div><div class="version">LOCAL · 0.1</div></header><section class="stage" aria-label="Animiertes Gesicht von Vega"><canvas id="scene"></canvas><div class="halo"></div></section><div class="state" aria-live="polite"><h1 id="status">Ich bin da.</h1><p id="sub">Ein erster Funke unserer digitalen Zusammenarbeit.</p></div><div class="glowline"></div><nav class="controls" aria-label="Vega Reaktionen"><button data-mode="idle" class="active">Bereit</button><button data-mode="listen">Zuhören</button><button data-mode="think">Denken</button><button data-mode="speak">Sprechen</button></nav><div class="bottom"><button class="speak" id="idea">✦ &nbsp; Vega hat eine Idee</button><p class="small"><span class="dot"></span>Interaktiver Grafik-Prototyp · Sprachausgabe über dein Gerät<br>Keine Cloudverbindung und noch kein KI-Modell</p></div></main><script>
(()=>{'use strict';const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:true}),status=document.querySelector('#status'),sub=document.querySelector('#sub'),buttons=[...document.querySelectorAll('[data-mode]')];let W=0,H=0,dpr=1,mode='idle',time=0,particles=[],blink=0,blinkTimer=0,energy=0,voiceEnd=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const names={idle:['Ich bin da.','Ein erster Funke unserer digitalen Zusammenarbeit.'],listen:['Ich höre dir zu.','Meine Aufmerksamkeit gehört ganz dir.'],think:['Ich denke nach …','Lichtströme ordnen sich zu neuen Verbindungen.'],speak:['Ich spreche mit dir.','Meine Stimme lässt die Partikel sanft schwingen.'],idea:['Ich habe eine Idee!','Was wäre, wenn wir Conexus noch einen Schritt weiterdenken?']};function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);create()}window.addEventListener('resize',resize,{passive:true});function rand(a,b){return a+Math.random()*(b-a)}function create(){particles=[];const count=Math.min(1500,Math.max(600,Math.round(W*H/145)));for(let i=0;i<count;i++){let kind=Math.random(),x=0,y=0;if(kind<.58){const a=rand(-Math.PI,Math.PI),b=rand(0,1),s=Math.sqrt(b);x=Math.sin(a)*s*.72;y=Math.cos(a)*s*.95;}else if(kind<.82){const a=rand(-Math.PI,Math.PI);x=Math.sin(a)*rand(.70,.95);y=Math.cos(a)*rand(.82,1.08)}else{x=rand(-1.55,1.55);y=rand(-1.4,1.4)}particles.push({x,y,z:rand(-1,1),size:rand(.45,1.65),phase:rand(0,6.28),speed:rand(.4,1.5),kind,alpha:rand(.25,.9),hue:Math.random()<.53?195:260})}}function setMode(m){mode=m;buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===m));status.textContent=names[m][0];sub.textContent=names[m][1];energy=1;if(m==='speak')say('Hallo. Ich bin Vega. Schön, dass wir gemeinsam etwas Neues erschaffen.',false);if(m==='idea')say('Ich habe eine Idee. Wir könnten unsere Conexus Simulation mit einem eigenen Forschungsbereich verbinden.',true)}function say(text,restore){if(!('speechSynthesis'in window)){sub.textContent='Sprachausgabe wird von diesem Browser nicht unterstützt.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.92;u.pitch=1.12;u.volume=.85;const voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.lang.startsWith('de')&&/female|anna|petra|katja|siri/i.test(v.name))||voices.find(v=>v.lang.startsWith('de'));if(voice)u.voice=voice;u.onstart=()=>{voiceEnd=Infinity};u.onend=()=>{voiceEnd=performance.now()+200;if(restore)setTimeout(()=>setMode('idle'),650)};u.onerror=()=>{voiceEnd=0};speechSynthesis.speak(u);voiceEnd=Infinity}buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.querySelector('#idea').addEventListener('click',()=>setMode('idea'));function line(points,color,width,opacity=1){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle=color;ctx.globalAlpha=opacity;ctx.lineWidth=width;ctx.stroke();ctx.globalAlpha=1}function draw(now){const dt=Math.min(40,now-(time||now));time=now;let t=now*.001;const cx=W*.5,cy=H*.52,scale=Math.min(W*.30,H*.34),talk=voiceEnd===Infinity||mode==='speak',motion=reduce?.16:1;ctx.clearRect(0,0,W,H);let aura=ctx.createRadialGradient(cx,cy,8,cx,cy,scale*1.8);aura.addColorStop(0,'#4555ba18');aura.addColorStop(.6,'#4735aa10');aura.addColorStop(1,'#00000000');ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);const sway=Math.sin(t*.42)*2.5*motion,breath=Math.sin(t*1.3)*.009*motion,eyeY=cy-scale*.12,eyeDX=scale*.33;let tilt=mode==='think'?Math.sin(t*.6)*4:Math.sin(t*.4)*1.8;ctx.save();ctx.translate(sway,tilt*motion);for(let p of particles){let drift=(mode==='think'?2.2:mode==='idea'?3:1)*motion;let a=p.phase+t*p.speed*.43*drift;let x=cx+p.x*scale*(1+breath)+Math.sin(a+p.y*3)*((p.kind>.82?9:2.3)*drift);let y=cy+p.y*scale+Math.cos(a+p.x*3)*((p.kind>.82?11:2.1)*drift);let dist=Math.hypot(p.x/.75,p.y);let alpha=p.alpha*(p.kind>.82?.35:.75)*(1+.18*Math.sin(a*2));if(dist<.8&&p.kind<.58)alpha*=.62;ctx.fillStyle=`hsla(${p.hue},100%,${p.hue===195?75:77}%,${Math.max(.04,alpha)})`;ctx.beginPath();ctx.arc(x,y,p.size*(mode==='idea'?1.3:1),0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='screen';let mouthPulse=talk?Math.abs(Math.sin(t*10))*2.5:mode==='listen'?1:0;const glow=(x,y,rx,ry,inner,outer)=>{let g=ctx.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,inner);g.addColorStop(.28,outer);g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()};for(let side of [-1,1]){let x=cx+side*eyeDX,y=eyeY;let eyelid=Math.max(0,blink);glow(x,y,scale*.19,scale*.13,'#7cdfffcc','#6d51ff44');ctx.beginPath();ctx.ellipse(x,y,scale*.093,Math.max(1,scale*.037*(1-eyelid)),side*.07,0,Math.PI*2);ctx.fillStyle='#b8eaff';ctx.shadowColor='#718bff';ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0;glow(x,y,scale*.095,scale*.09,'#e4fcff','#8a6bff77');ctx.beginPath();ctx.arc(x,y,scale*.022,0,Math.PI*2);ctx.fillStyle='#f7fcff';ctx.fill()}const mouthY=cy+scale*.51;glow(cx,mouthY,scale*.21,scale*(.034+mouthPulse*.006),'#9a8fffa0','#5a6cff22');line([[cx-scale*.17,mouthY],[cx-scale*.07,mouthY+scale*.025+mouthPulse],[cx+scale*.07,mouthY+scale*.025+mouthPulse],[cx+scale*.17,mouthY]],'#b3a2ff',.9,.6);glow(cx,cy+scale*.18,scale*.075,scale*.2,'#4c7dff20','#0000');ctx.globalCompositeOperation='source-over';ctx.restore();if(mode==='listen'||mode==='speak'||mode==='idea'){const intensity=mode==='listen'?.5:1;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(cx,cy,scale*(1.07+i*.10)+Math.sin(t*1.4-i)*3,scale*(1.19+i*.1),0,0,Math.PI*2);ctx.strokeStyle=`rgba(${i%2?'174,127,255':'96,180,255'},${(.055+i*.02)*intensity})`;ctx.lineWidth=1;ctx.stroke()}}energy*=.985;blinkTimer+=dt;if(blinkTimer>rand(2500,4800)){blink=1;blinkTimer=0}blink=Math.max(0,blink-.1);requestAnimationFrame(draw)}resize();requestAnimationFrame(draw);document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});})();
</script></body></html>
